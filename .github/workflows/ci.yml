name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - name: Python lint
        run: python -m ruff check .
      - name: Python tests without CUDA Toolkit
        run: python -m pytest tests/test_codec.py tests/test_asm.py tests/test_fatbin.py tests/test_debug_policy.py tests/test_standalone.py
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: cubin-sass-vsix
          path: cubin-sass.vsix

  cuda-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
    env:
      NVISA_SLOW: '1'
      CUBIN_SASS_REQUIRE_CUDA: '1'
    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pip binutils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify CUDA toolchain
        run: |
          nvcc --version
          nvdisasm --version
          cuobjdump --version
          readelf --version
      - run: npm ci
      - run: python3 -m pip install -r requirements-dev.txt
      - name: JavaScript tests including real CUDA backend roundtrips
        run: npm test
      - name: Complete Python suite including slow corpus tests
        run: python3 -m pytest --junitxml=cuda-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-test-results
          path: cuda-test-results.xml
          if-no-files-found: ignore
