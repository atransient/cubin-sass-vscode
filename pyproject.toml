[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = ["data", "corpus", "node_modules"]

[tool.ruff.lint]
# Errors that indicate real defects: syntax/IO errors, pyflakes and bugbear.
select = ["E9", "F", "B"]
# zip() strictness and unused loop indices are style choices in this codebase.
ignore = ["B905", "B007"]
